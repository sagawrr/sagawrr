name: Publish README

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/publish-readme.yml

concurrency:
  group: publish-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Render project card
        run: node .github/scripts/update-readme-v2.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_KEY_7X9K2M }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git diff --quiet README.md && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "🔮 MATRIX UPDATE: Neural network synchronized with latest project data"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2da44e&color_dots=#ebedf0,#aceebb,#4ac26b,#2da44e,#116329
            dist/snake-dark.svg?palette=github-dark&color_snake=#8CFF98&color_dots=#161b22,#0e4429,#006d32,#26a641,#8CFF98

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 snake regenerated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
