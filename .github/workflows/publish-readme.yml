name: Publish README

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/publish-readme.yml
      - assets/kagome.json

concurrency:
  group: publish-readme
  cancel-in-progress: false

# Nothing by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit README.md + generated SVGs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # script runs without the push token on disk

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Render README and SVG cards
        run: bun .github/scripts/update-readme.mjs
        env:
          # Read-only PAT: private repo metadata + private contribution counts
          GITHUB_TOKEN: ${{ secrets.GH_API_KEY_7X9K2M }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit changes
        env:
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add README.md assets/terminal.svg assets/projects.svg assets/contrib.svg
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🔮 MATRIX UPDATE: Neural network synchronized with latest project data"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
